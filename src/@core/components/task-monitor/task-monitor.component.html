<div class="table-responsive" style="max-height: 100%; overflow: auto;">
  <table class="table table-striped">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Programa</th>
        <th scope="col">Estatus</th>
        <th scope="col">Argumento</th>
        <!-- <th scope="col">Tiempo</th> -->
      </tr>
    </thead>
    <tbody>
      @if (!rowData || rowData.length === 0) {
        <tr>
          <td colspan="4" class="text-center">No hay procesos en segundo plano</td>
        </tr>
      }
      @for (row of rowData; track row; let i = $index) {
        <tr>
          <td>{{ row.pid }}</td>
          <td>{{ row.programa }}</td>
          <td>
            @if (!row.estatus) {
              <div class="badge badge-glow badge-success">Completado</div>
            }
            @if (row.estatus) {
              <div class="badge badge-glow badge-warning">En Proceso</div>
            }
          </td>
          <td>{{ row.argumento }}</td>
          <!-- <td>{{ row.tiempo }}</td> -->
        </tr>
      }
    </tbody>
  </table>
</div>
