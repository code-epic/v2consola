<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <!-- content-header component -->
    <app-content-header [contentHeader]="contentHeader"></app-content-header>

    <section class="invoice-list-wrapper">
      <div class="card">
        <div class="row">
          <div class="col-md-12 col-12">


            <!-- Log Selection Grid -->
            <section class="log-selection-section">
              <div class="log-selection-grid">
                @for (option of logOptions; track option) {
                  <div
                    class="log-option-card"
                    [class.active]="selectedLogType === option.id"
                    [class]="option.class"
                    (click)="selectOption(option)">
                    <div class="card-icon">
                      <i [data-feather]="option.icon"></i>
                    </div>
                    <div class="card-content">
                      <h3>{{ option.title }}</h3>
                      <p>{{ option.description }}</p>
                    </div>
                    <div class="card-action-indicator">
                      <i data-feather="arrow-right"></i>
                    </div>
                  </div>
                }
              </div>

              <!-- Log Viewer Container with Animation -->
              @if (nameFnx!='') {
                <div class="log-viewer-wrapper">
                  <div class="log-viewer-container slide-up-fade">
                    <app-query-log [rawLogs]="nameFnx"></app-query-log>
                  </div>
                </div>
              }
            </section>


          </div>
        </div>
      </div>
    </section>


  </div>
</div>
