<div class="content-wrapper container-xxl p-0" *blockUI="'section-block'">
    <div class="content-body">
        <!-- Fondo Animado -->
        <div class="background-shapes">
            <div class="shape shape1"></div>
            <div class="shape shape2"></div>
            <div class="shape shape3"></div>
        </div>

        <!-- content-header component -->
        <app-content-header [contentHeader]="contentHeader"></app-content-header>

        <!-- Incidencias Content -->
        <section class="invoice-list-wrapper position-relative">
            <div class="card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-12">
                            <h4 class="card-title">Gestión de Incidencias</h4>
                            <p class="card-text">
                                Registro y seguimiento de tickets de soporte técnico.
                            </p>
                        </div>
                    </div>
                    
                    <!-- Placeholder for content -->
                    <div class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
                        <div class="text-center">
                            <span [data-feather]="'alert-circle'" [size]="64" class="text-danger mb-2"></span>
                            <h5>Modulo de Incidencias en Desarrollo</h5>
                            <p class="text-muted">Próximamente podrá reportar y gestionar incidencias aquí.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

<style>
  .background-shapes {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(234, 84, 85, 0.05); /* Tono rojo para incidencias/alertas */
    animation: float 20s infinite linear;
  }
  .shape1 { width: 200px; height: 200px; top: 10%; left: 5%; animation-duration: 25s; }
  .shape2 { width: 150px; height: 150px; top: 60%; left: 85%; animation-duration: 18s; }
  .shape3 { width: 100px; height: 100px; top: 75%; left: 15%; animation-duration: 22s; }

  @keyframes float {
    0% { transform: translateY(0px) translateX(0px) rotate(0deg); }
    50% { transform: translateY(-25px) translateX(15px) rotate(180deg); }
    100% { transform: translateY(0px) translateX(0px) rotate(360deg); }
  }
</style>
