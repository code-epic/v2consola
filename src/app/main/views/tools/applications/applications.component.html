        <section id="ecommerce-searchbar" class="ecommerce-searchbar">
            <div class="row mt-1">
              <!-- Select para elegir el tipo de búsqueda -->
              <div class="col-sm-3">
                <select class="form-control" [(ngModel)]="searchType" style="height: 40px;">
                  <option value="conexiones">Buscar por Conexiones</option>
                  <option value="api">Buscar por API</option>
                </select>
              </div>
          
              <!-- Input de búsqueda normal (para conexiones) -->
              <div class="col-sm-9" *ngIf="searchType === 'conexiones'">
                <div class="input-group input-group-merge">
                  <input type="text" class="form-control search-product" id="shop-search" placeholder="Buscar"
                         [(ngModel)]="searchText" aria-label="Search..." aria-describedby="shop-search" style="height: 40px;" />
                  <div class="input-group-append">
                    <span class="input-group-text" style="height: 40px;"><i data-feather="search" class="text-muted"></i></span>
                  </div>
                </div>
              </div>
          
              <!-- ng-select (para API) -->
              <div class="col-sm-9" *ngIf="searchType === 'api'">
                <ng-select 
                           [items]="rowData"
                           [(ngModel)]="selectCustomSelected"
                           bindLabel="funcion"
                           bindValue="id"
                           [searchable]="true"
                           placeholder="Seleccione API"
                           [hideSelected]="false"
                           (change)="LinkRuta($event)"
                           style="height: 40px; border: 1px solid #ccc; border-radius: 4px;">
                  <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
                    <div style="margin: 10px 0" class="card">
                      <div class="card-body">
                        <h5 class="card-title">{{ item.funcion }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ item.descripcion }}</h6>
                        <p class="card-text">
                          {{ item.tipo }} --- {{ item.aplicacion }}
                        </p>
                      </div>
                    </div>
                  </ng-template>
                </ng-select>
              </div>
            </div>
          </section>

        <br>

        <section id="wishlist" class="grid-view wishlist-items">
            <ng-container
                *ngFor="let product of ListaAplicaciones  | filter: searchText:'nombre'  | slice: (page - 1) * pageSize:(page - 1) * pageSize + pageSize">


                <!-- Ecommerce Item -->

                <div class="card ecommerce-card col-sm-12 tarjeta">
                    <a [routerLink]="'/tools/api/' + product.nombre">

                        <div class="item-img text-center efecto-img">
                            <img class="img-fluid" width="100px" height="100px" src="assets/images/logo/logo.png"
                                alt="img-placeholder" />
                        </div>

                        <div class="card-body">

                            <div class="item-wrapper">
                                <div class="item-rating">
                                    <div class="rating rating-sm">
                                        <div class="badge badge-success" *ngIf="product.status === '1'">Activo</div>
                                        <div class="badge badge-danger" *ngIf="product.status === '0'">Inactivo</div>
                                    </div>
                                </div>
                                <div class="item-cost">
                                    <h6 class="item-price">
                                        {{ product.nombre | uppercase }}
                                    </h6>
                                </div>
                            </div>
                            <p class="card-text item-description">
                                <strong>{{ product.basedatos }}</strong> - {{ product.fecha }}
                            </p>
                        </div>

                    </a>

                </div>
                <!--/ Ecommerce Item -->
            </ng-container>
        </section>


        <!-- E-commerce Pagination Starts -->
        <section id="ecommerce-pagination">
            <div class="row">
                <div class="col-sm-12">
                    <div class="d-flex justify-content-center">
                        <ngb-pagination [collectionSize]="(drivers | filter: searchText:'funcion').length"
                            [(page)]="page" [maxSize]="5" [rotate]="true" [ellipses]="false" [boundaryLinks]="true">
                            <!-- Custom pagination icons -->
                            <ng-template ngbPaginationPrevious><span [data-feather]="'chevron-left'"
                                    [class]="'font-weight-bolder'" [size]="18"></span>
                            </ng-template>
                            <ng-template ngbPaginationFirst><span [data-feather]="'chevrons-left'"
                                    [class]="'font-weight-bolder'" [size]="18"></span>
                            </ng-template>
                            <ng-template ngbPaginationNext><span [data-feather]="'chevron-right'"
                                    [class]="'font-weight-bolder'" [size]="18"></span></ng-template>
                            <ng-template ngbPaginationLast><span [data-feather]="'chevrons-right'"
                                    [class]="'font-weight-bolder'" [size]="18"></span>
                            </ng-template>
                        </ngb-pagination>
                    </div>
                </div>
            </div>
        </section>
        <!-- E-commerce Pagination Ends -->

    </div>
</div>
