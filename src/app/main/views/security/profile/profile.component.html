<div class="content-wrapper container-xxl p-0" *blockUI="'section-block'">
    <div class="content-body">
        <!-- content-header component -->
        <app-content-header [contentHeader]="contentHeader"></app-content-header>


        <!-- Invoice List -->
        <section class="invoice-list-wrapper">
            <div class="card">

                <div class="col-md-12 ">
                    <br>
                    <ul ngbNav [(activeId)]="active" #navWithIcons="ngbNav" (click)="selTab($event)"
                        class="nav-pills justify-content-center">
                        <li [ngbNavItem]="1">
                            <a ngbNavLink class="d-flex align-items-center"><span [data-feather]="'list'" class="mr-1"></span><span class="font-weight-bold">Listado de Perfiles</span></a>
                            <ng-template ngbNavContent>



                                <div class="col-md-12">
                                    <ngx-datatable [rows]="lstPerfil" [rowHeight]="58" class="bootstrap core-bootstrap"
                                        [limit]="10" [columnMode]="ColumnMode.force" [headerHeight]="40"
                                        [footerHeight]="50" [scrollbarH]="true" [limit]="basicSelectedOption">

                                        <ngx-datatable-column name="APLICACION / ROL" prop="aplicacion" [width]="10">
                                            <ng-template let-row="row" ngx-datatable-cell-template>
                                                <div class="d-flex align-items-center">
                                                    <span [data-feather]="'box'" [size]="18" class="text-primary mr-1"></span>
                                                    <span class="font-weight-bold">{{ row.aplicacion }}</span>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-column>

                                        <ngx-datatable-column name="PERFIL" prop="nombre" [width]="10">
                                            <ng-template let-nombre="value" ngx-datatable-cell-template>
                                                <div>
                                                    <span [data-feather]="'user-check'" [size]="16" class="text-secondary mr-1"></span>
                                                    <span class="font-weight-bold">{{ nombre }}</span>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-column>

                                        <ngx-datatable-column name="DESCRIPCION" prop="descripcion" [width]="20">
                                            <ng-template let-descripcion="value" ngx-datatable-cell-template>
                                                <div>
                                                    <span class="text-muted">{{ descripcion }}</span>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-column>

                                        <ngx-datatable-column name="ESTATUS" prop="estatus" [width]="5">
                                            <ng-template let-estatus="value" ngx-datatable-cell-template>

                                                <div class="badge badge-light-danger" *ngIf="estatus==0">Inactivo</div>
                                                <div class="badge badge-light-success" *ngIf="estatus==1">Activo</div>
                                            </ng-template>
                                        </ngx-datatable-column>

                                        <ngx-datatable-column name="ACCIÓN" [width]="5" [sortable]="false">
                                            <ng-template ngx-datatable-cell-template let-row="row">
                                                <div ngbDropdown container="body">
                                                    <button ngbDropdownToggle type="button"
                                                        class="btn icon-btn btn-sm hide-arrow" rippleEffect>
                                                        <span [data-feather]="'settings'"
                                                            [class]="'cursor-pointer'"></span>
                                                    </button>
                                                    <div ngbDropdownMenu>
                                                        <a (click)="editarRol(row)" ngbDropdownItem><span
                                                                [data-feather]="'edit'" [size]="16"
                                                                [class]="'mr-50'"></span> Editar</a>

                                                        <a (click)="eliminarRol(row)" ngbDropdownItem><span
                                                                [data-feather]="'trash'" [size]="16"
                                                                [class]="'mr-50'"></span> Eliminar</a>
                                                    </div>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-column>

                                    </ngx-datatable>


                                </div>

                            </ng-template>
                        </li>
                        <li [ngbNavItem]="2">
                            <a ngbNavLink class="d-flex align-items-center"><span [data-feather]="'user-plus'" class="mr-1"></span><span class="font-weight-bold">{{registrar}}</span></a>
                            <ng-template ngbNavContent>

                                <div class="col-md-12" style="margin-top: 25px;">

                                    <!-- Primer -->
                                    <div class="row">
                                        <div class="form-group col-md-6" *ngIf="blApp">
                                            <label class="form-label" for="app-select">Seleccionar Aplicación</label>
                                            <ng-select [items]="lstAplicaciones" [(ngModel)]="Perfil.aplicacion"
                                                [ngModelOptions]="{standalone: true}" bindLabel="name"
                                                (ngModelChange)="selRol($event)" bindValue="id"
                                                placeholder="Seleccione una Aplicación"></ng-select>
                                        </div>

                                        <div class="form-group col-md-6" *ngIf="!blApp">
                                            <label class="form-label">Aplicacion</label>
                                            <div class="input-group input-group-merge">
                                                <div class="input-group-prepend"><span class="input-group-text"><span [data-feather]="'box'"></span></span></div>
                                                <input [(ngModel)]="xaplicacion" [ngModelOptions]="{standalone: true}" type="text"
                                                    placeholder="Aplicacion" class="form-control" disabled="disabled">
                                            </div>
                                        </div>

                                        <div class="form-group col-md-6" *ngIf="blApp">
                                            <label class="form-label" for="rol-select">Seleccionar Rol</label>
                                            <ng-select [items]="dataRol" [(ngModel)]="rol"
                                                [ngModelOptions]="{standalone: true}" (ngModelChange)="selRolDetalle()"
                                                bindLabel="name" bindValue="id"
                                                placeholder="Seleccione un Rol"></ng-select>
                                        </div>

                                        <div class="form-group col-md-6" *ngIf="!blApp">
                                            <label class="form-label">Rol</label>
                                            <div class="input-group input-group-merge">
                                                <div class="input-group-prepend"><span class="input-group-text"><span [data-feather]="'shield'"></span></span></div>
                                                <input [(ngModel)]="xrol" [ngModelOptions]="{standalone: true}" type="text" placeholder="Rol"
                                                    class="form-control" disabled="disabled">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="row">
                                        <div class="form-group col-md-6">
                                            <label class="form-label" for="profile-name">Nombre del Perfil</label>
                                            <div class="input-group input-group-merge">
                                                <div class="input-group-prepend"><span class="input-group-text"><span [data-feather]="'user-check'"></span></span></div>
                                                <input [(ngModel)]="Perfil.nombre" [ngModelOptions]="{standalone: true}" type="text"
                                                    id="profile-name" placeholder="Ej: Administrador de Ventas" class="form-control"
                                                    [disabled]="desactivo">
                                            </div>
                                        </div>

                                        <div class="form-group col-md-6">
                                            <label class="form-label" for="profile-desc">Descripción del Perfil</label>
                                            <div class="input-group input-group-merge">
                                                <div class="input-group-prepend"><span class="input-group-text"><span [data-feather]="'file-text'"></span></span></div>
                                                <input [(ngModel)]="Perfil.descripcion" [ngModelOptions]="{standalone: true}" type="text"
                                                    id="profile-desc" placeholder="Una breve descripción de las responsabilidades del perfil" class="form-control">
                                            </div>
                                        </div>
                                    </div>
                                    <br>

                                </div>


                                <div class="col-md-12">
                                    <h5 class="mb-3" *ngIf="dataRolDetalles.length > 0">Permisos del Perfil</h5>
                                    <ngx-datatable *ngIf="dataRolDetalles.length > 0" [rows]="dataRolDetalles"
                                        [rowHeight]="58" class="bootstrap core-bootstrap" [limit]="basicSelectedOption"
                                        [columnMode]="ColumnMode.force" [selectionType]="SelectionType.checkbox"
                                        [headerHeight]="40" [footerHeight]="50" [scrollbarH]="true"
                                        (select)="onSelect($event)">

                                        <ngx-datatable-row-detail [rowHeight]="'auto'" #rowDetail>

                                            <ng-template let-row="row" ngx-datatable-row-detail-template>
                                                <div class="p-2 border-top" style="background-color: #f8f9fa;">
                                                    <!-- Nivel 2: Sub-Menús -->
                                                    <div *ngFor="let subMenu of row.children; let i = index" class="py-1" style="margin-left: 30px;">
                                                        <div class="d-flex align-items-center mb-1">
                                                            <!-- Botón para expandir Privilegios -->
                                                            <button *ngIf="subMenu.children && subMenu.children.length > 0" class="btn btn-sm btn-link p-0 mr-2" (click)="subMenu.isExpanded = !subMenu.isExpanded">
                                                                <!-- Solución definitiva: Usar [ngClass] para evitar la recreación del elemento y el conflicto con la directiva -->
                                                                <span [ngClass]="{'icon-plus': !subMenu.isExpanded, 'icon-minus': subMenu.isExpanded}" [size]="16"></span>
                                                            </button>
                                                            <!-- Checkbox del Sub-Menú -->
                                                            <div class="custom-control custom-checkbox" [style.margin-left]="(!subMenu.children || subMenu.children.length === 0) ? '24px' : '0'">
                                                                <input type="checkbox" class="custom-control-input" [checked]="subMenu.estatus === 1" (change)="onSubMenuCheckboxChange(subMenu, $event)" id="subMenuChkbxRef{{ row.menu + i }}" />
                                                                <label class="custom-control-label" for="subMenuChkbxRef{{ row.menu + i }}">
                                                                    <span class="ml-2 font-weight-bolder" style="color: #5e5873;">{{ subMenu.accion }}</span>
                                                                </label>
                                                            </div>
                                                        </div>

                                                        <!-- Nivel 3: Privilegios (si está expandido) -->
                                                        <div class="privileges-container" [class.show]="subMenu.isExpanded">
                                                            <div *ngFor="let privilegio of subMenu.children; let j = index" class="custom-control custom-checkbox mr-3 mb-1">
                                                                <input type="checkbox" class="custom-control-input" [checked]="privilegio.estatus === 1" (change)="onPrivilegeCheckboxChange(privilegio, subMenu, $event)" id="privChkbxRef{{ row.menu + i + j }}" />
                                                                <label class="custom-control-label" for="privChkbxRef{{ row.menu + i + j }}">
                                                                    <span class="ml-2 font-weight-normal" style="color: #6e6b7b;">{{ privilegio.accion }}</span>
                                                                </label>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-row-detail>

                                        <ngx-datatable-column [width]="50" [sortable]="false" [canAutoResize]="false"
                                            [draggable]="false" [resizeable]="false">

                                            <ng-template ngx-datatable-header-template let-selectFn="selectFn">
                                                <div class="custom-control custom-checkbox">
                                                    <input type="checkbox" class="custom-control-input"
                                                        id="headerChkbxRef" (change)="onMasterCheckboxChange($event)" />
                                                    <label class="custom-control-label" for="headerChkbxRef"></label>
                                                </div>
                                            </ng-template>

                                            <ng-template ngx-datatable-cell-template let-row="row"
                                                let-rowIndex="rowIndex">
                                                <div class="custom-control custom-checkbox">
                                                    <input type="checkbox" class="custom-control-input"
                                                        [checked]="row.estatus === 1"
                                                        (change)="onParentCheckboxChange(row, $event)"
                                                        id="rowChkbxRef{{ rowIndex }}" />
                                                    <label class="custom-control-label"
                                                        for="rowChkbxRef{{ rowIndex }}"></label>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-column>

                                        <ngx-datatable-column name="MÓDULO" [width]="250" prop="modulo">
                                            <ng-template let-row="row" let-value="value" ngx-datatable-cell-template>
                                                <div class="d-flex align-items-center">

                                                    <button *ngIf="row.children && row.children.length > 0"
                                                        class="btn btn-sm btn-link p-0 mr-2" title="Expandir/Contraer"
                                                        (click)="table?.rowDetail.toggleExpandRow(row)">
                                                        <span [data-feather]="row.isExpanded ? 'minus' : 'plus'"></span>
                                                    </button>
                                                    <span [data-feather]="'grid'" [size]="18" class="text-primary mr-1"></span>
                                                    <span class="font-weight-bold">{{ row.modulo }} </span>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-column>

                                        <ngx-datatable-column name="MENÚ" [width]="200" prop="menu">
                                            <ng-template let-menu="value" ngx-datatable-cell-template>
                                                <span class="font-weight-normal">{{ menu }}</span>
                                            </ng-template>
                                        </ngx-datatable-column>

                                        <ngx-datatable-column name="ACCIÓN" [width]="100" prop="accion">
                                            <ng-template let-accion="value" ngx-datatable-cell-template>
                                                <div>
                                                    <span *ngIf="accion === '-'" class="badge badge-pill badge-light-secondary">Grupo de Permisos</span>
                                                    <span *ngIf="accion !== '-'" class="font-weight-bold">{{ accion
                                                        }}</span>
                                                </div>
                                            </ng-template>
                                        </ngx-datatable-column>


                                    </ngx-datatable>




                                </div>



                                <div class="col-md-12" align="right">
                                    <br>

                                    <button type="button" class="btn btn-warning" (click)="Limpiar()">
                                        <span [data-feather]="'trash-2'" class="mr-1"></span>Limpiar
                                    </button>
                                    &nbsp;&nbsp;
                                    <button type="button" class="btn btn-primary" (click)="guardarPerfiles()">
                                        <span [data-feather]="'save'" class="mr-1"></span>Guardar Perfil
                                    </button>
                                </div>
                                <br><br>
                            </ng-template>
                        </li>
                    </ul>
                    <div [ngbNavOutlet]="navWithIcons" class="mt-2"></div>
                </div>









            </div>
        </section>

    </div>
</div>
