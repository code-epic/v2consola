<div class="misc-wrapper" [ngStyle]="{ 'background-color': '#f8f9fa' }">
  <!-- Animación de fondo -->
  <div class="background-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <!-- Movimos el contenido hacia arriba con justify-content-start y padding -->
  <div class="misc-inner d-flex flex-column col-lg-12 align-items-center justify-content-center p-4">
    <div class="w-100 text-center">
      <!-- Imagen SVG Animada -->
      <div class="animated-lock-container mb-4">
        <svg style="width: 150px; height: auto;"
          class="animated-lock"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 100 125"
          xml:space="preserve"
        >
          <g class="lock-body">
            <path
              fill="#7367F0"
              d="M82.1,48.4H78V35.3C78,20.8,65.2,8,50.7,8S23.4,20.8,23.4,35.3v13.1h-4.1c-3.3,0-6,2.7-6,6v34.5c0,3.3,2.7,6,6,6h62.8c3.3,0,6-2.7,6-6V54.4C88.1,51.1,85.4,48.4,82.1,48.4z M31.4,35.3c0-10.1,8.2-18.3,18.3-18.3s18.3,8.2,18.3,18.3v13.1H31.4V35.3z"
            />
          </g>
          <g class="shackle">
            <path
              fill="#7367F0"
              d="M62.1,21.3c0-6.8-5.5-12.3-12.3-12.3S37.4,14.5,37.4,21.3v14h8V21.3c0-2.4,1.9-4.3,4.3-4.3s4.3,1.9,4.3,4.3v14h8V21.3z"
            />
          </g>
        </svg>
      </div>

      <h1 class="mb-2 font-weight-bolder" style="color: #5e5873;">Acceso Restringido</h1>
      <p class="mb-4" style="color: #6e6b7b;">
        No tienes permiso para ver esta página. <br />
        Serás redirigido automáticamente en <span class="countdown-timer">{{ countdown }}</span> segundos.
      </p>

      <a class="btn btn-primary btn-lg mb-2" (click)="goBack()" rippleEffect>
        <span>Regresar a la página anterior</span>
      </a>
    </div>
  </div>
</div>

<!-- Estilos para la animación y el diseño -->
<style>
  .misc-wrapper {
    position: relative;
    overflow: hidden;
  }
  .background-shapes {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  .shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(115, 103, 240, 0.08); /* Color pastel suave */
    animation: float 20s infinite linear;
  }
  .shape1 { width: 200px; height: 200px; top: 5%; left: 10%; animation-duration: 25s; }
  .shape2 { width: 120px; height: 120px; top: 65%; left: 80%; animation-duration: 18s; }
  .shape3 { width: 80px; height: 80px; top: 80%; left: 5%; animation-duration: 22s; }

  @keyframes float {
    0% { transform: translateY(0px) translateX(0px) rotate(0deg); }
    50% { transform: translateY(-30px) translateX(20px) rotate(180deg); }
    100% { transform: translateY(0px) translateX(0px) rotate(360deg); }
  }

  .misc-inner {
    z-index: 1;
    transform: translateY(-10%); /* Sube el contenido un 10% desde el centro */
  }

  .animated-lock-container {
    animation: float-lock 6s ease-in-out infinite;
  }

  .animated-lock .shackle {
    animation: lock-shake 2s ease-in-out infinite alternate;
    transform-origin: 50% 50%;
  }

  @keyframes float-lock {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  @keyframes lock-shake {
    0%, 100% { transform: translateX(-2px) rotate(-3deg); }
    50% { transform: translateX(2px) rotate(3deg); }
  }

  .countdown-timer {
    font-weight: bold;
    color: #7367F0; /* Coincide con el color del candado */
    font-size: 1.1em;
  }
</style>
