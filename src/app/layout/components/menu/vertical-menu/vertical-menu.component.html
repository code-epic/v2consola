<!-- Menu header -->
<div class="navbar-header">
  <ul class="nav navbar-nav flex-row">
    <li class="nav-item mr-auto" style="margin-top: -13px;">
      <!-- App Branding -->
      <div *ngIf="isBDV">
        <a class="navbar-brand" [routerLink]="['/']">
            <img src="{{ logo }}" alt="brand-logo" width="128px"/>
        </a>
      </div>
      <div *ngIf="!isBDV">
        <a class="navbar-brand" [routerLink]="['/']">
          <span class="brand-logo">
            <img src="{{ logo }}" alt="brand-logo" />
          </span>
          <h2 class="brand-text mb-0">{{ coreConfig.app.appName }}</h2>
        </a>
      </div>
    </li>

    <!-- Menu Toggler -->
    <li class="nav-item nav-toggle">
      <a class="nav-link modern-nav-toggle d-none d-xl-block pr-0" (click)="toggleSidebarCollapsible()">
        <i [ngClass]="isCollapsed === true ? 'icon-circle' : 'icon-disc'"
          class="toggle-icon feather font-medium-4 collapse-toggle-icon text-primary"></i>
      </a>
      <a class="nav-link modern-nav-toggle d-block d-xl-none pr-0" (click)="toggleSidebar()">
        <i data-feather="x" class="font-medium-4 text-primary toggle-icon"></i>
      </a>
    </li>
  </ul>
</div>
<!--/ Menu header -->

<!-- Navbar shadow -->
<div class="shadow-bottom" [ngClass]="{ 'd-block': isScrolled }"></div>

<!-- Main menu -->
<div class="main-menu-content" #mainMenuContent>
  <ul class="navigation navigation-main" layout="vertical" core-menu></ul>
</div>
<!--/ Main menu -->

<!-- Menu Footer Progress -->
<div class="menu-footer-progress-wrapper" *ngIf="blCargando">
  <div class="card-progress">
    <!-- Modo Determinado (con porcentaje) -->
    <ng-container *ngIf="progressMode === 'determinate'">
      <div class="progress-info">
        <span class="progress-label">{{ progressLabel }}</span>
        <span class="progress-percentage">{{ progressPercentage }}%</span>
      </div>
      <div class="progress progress-xs">
        <div
          class="progress-bar"
          role="progressbar"
          [style.width.%]="progressPercentage"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
      <div class="progress-details">
        <span>{{ progressText }}</span>
      </div>
    </ng-container>

    <!-- Modo Indeterminado (con velocidad) -->
    <ng-container *ngIf="progressMode === 'indeterminate'">
      <div class="progress-info">
        <span class="progress-label">{{ progressLabel }}</span>
        <span class="progress-speed">{{ speed }}</span>
      </div>
      <div class="progress progress-xs">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          style="width: 100%"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
      <div class="progress-details">
        <span>{{ progressText }}</span>
      </div>
    </ng-container>
  </div>
</div>
<!--/ Main menu -->
