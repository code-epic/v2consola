  <style type="text/css">
    #loading-bg {
      width: 100%;
      height: 100%;
      background: #fff;
      display: block;
      position: absolute;
      z-index: 99999;
      pointer-events: none;
    }

    /* Contenedor del logo y la barra de progreso */
    .loading-logo {
      position: absolute;
      left: 50%;
      top: 35%;
      transform: translateX(-50%);
      animation: floatAndPulse 3s ease-in-out infinite;
    }



    /* Barra de progreso animada */
    .loading {
      position: absolute;
      left: 50%;
      top: calc(35% + 240px); /* Aumentada la distancia */
      width: 200px;
      height: 4px;
      background-color: #f0f0f0;
      border-radius: 2px;
      transform: translateX(-50%);
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    .loading::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: #ff9500; /* Naranja principal */
      border-radius: 2px;
      animation: progressBar 2.5s ease-in-out infinite;
    }

    /* Nueva animación de Flote y Pulso para el logo */
    @keyframes floatAndPulse {
      0% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
      50% {
        transform: translateX(-50%) translateY(-10px) scale(1.03);
        opacity: 0.95;
      }
      100% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
    }

    /* Animación de la barra de progreso más suave */
    @keyframes progressBar {
      0% {
        left: -50%;
        width: 50%;
      }
      40% {
        width: 35%;
      }
      50% {
        left: 50%;
        width: 30%;
      }
      100% {
        left: 100%;
        width: 70%;
      }
    }
  </style>
<link rel="stylesheet" href="styles.c3a529212f1a65e2.css"></head>

<body>
  <core-loading-screen id="loading-bg">
    <div class="loading-logo" id="loading-logo-container"></div>
    <div class="loading"></div>
  </core-loading-screen>
  <app-root> </app-root>

  <script>
    (function() {
      const logoContainer = document.getElementById('loading-logo-container');
      if (logoContainer) {
        const url = window.location.href.toLowerCase(); // URL actual en minúsculas
        const bdvKeywords = ['sicoex', 'banv', 'corp', '4201']; // Palabras clave
        let logoSrc = 'assets/images/logo/logo.png'; // Logo por defecto
        let pageTitle = 'Sandra Server'; // Título por defecto
        let faviconSrc = 'favicon.ico'; // Favicon por defecto

        // Comprueba si la URL contiene alguna de las palabras clave
        if (bdvKeywords.some(keyword => url.includes(keyword))) {
          logoSrc = 'assets/images/logo/logo-bdv.png'; // Cambia al logo de BDV
          pageTitle = 'BDV Server'; // Cambia el título
          faviconSrc = 'assets/images/bdv/favicon.ico'; // Cambia el favicon
        }

        // Actualiza el título de la página
        window.document.title = pageTitle;

        // Actualiza el favicon
        const link = document.querySelector("link[rel~='icon']");
        if (link) {
          link.href = faviconSrc;
        }

        // Crea y configura la etiqueta <img> dinámicamente
        const imgElement = document.createElement('img');
        imgElement.src = logoSrc;
        imgElement.width = 200;
        imgElement.height = 200;
        imgElement.alt = 'Logo';

        // Inserta la imagen en el contenedor
        logoContainer.appendChild(imgElement);
      }
    })();
  </script>
