  <style type="text/css">
    #loading-bg {
      width: 100%;
      height: 100%;
      background: #fff;
      display: block;
      position: absolute;
      z-index: 99999;
      pointer-events: none;
    }

    /* Contenedor del logo y la barra de progreso */
    .loading-logo {
      position: absolute;
      left: 50%;
      top: 35%;
      transform: translateX(-50%);
      animation: floatAndPulse 3s ease-in-out infinite;
    }



    /* Barra de progreso animada */
    .loading {
      position: absolute;
      left: 50%;
      top: calc(35% + 240px);
      /* Aumentada la distancia */
      width: 200px;
      height: 4px;
      background-color: #f0f0f0;
      border-radius: 2px;
      transform: translateX(-50%);
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    .loading::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: #ff9500;
      /* Naranja principal */
      border-radius: 2px;
      animation: progressBar 2.5s ease-in-out infinite;
    }

    /* Nueva animación de Flote y Pulso para el logo */
    @keyframes floatAndPulse {
      0% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }

      50% {
        transform: translateX(-50%) translateY(-10px) scale(1.03);
        opacity: 0.95;
      }

      100% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
    }

    /* Animación de la barra de progreso más suave */
    @keyframes progressBar {
      0% {
        left: -50%;
        width: 50%;
      }

      40% {
        width: 35%;
      }

      50% {
        left: 50%;
        width: 30%;
      }

      100% {
        left: 100%;
        width: 70%;
      }
    }
  </style>
<link rel="stylesheet" href="styles.ed494e226a371054.css"></head>

<body>
  <core-loading-screen id="loading-bg">
    <div class="loading-logo" id="loading-logo-container"></div>
    <div class="loading"></div>
  </core-loading-screen>
  <app-root> </app-root>

  <script>
    (function () {
      // Configuración de temas
      const config = {
        default: {
          logo: 'assets/images/logo/logo.png',
          title: 'Sandra Server',
          favicon: 'favicon.ico'
        },
        bdv: {
          keywords: ['sicoex', 'banv', 'corp'],
          logo: 'assets/images/logo/logo-bdv.png',
          title: 'BDV Server',
          favicon: 'assets/images/bdv/favicon.ico'
        }
      };

      const logoContainer = document.getElementById('loading-logo-container');
      if (!logoContainer) return;

      const url = window.location.href.toLowerCase();
      const isBdv = config.bdv.keywords.some(keyword => url.includes(keyword));
      const theme = isBdv ? config.bdv : config.default;

      // Actualizar UI
      window.document.title = theme.title;

      const link = document.querySelector("link[rel~='icon']");
      if (link) link.href = theme.favicon;

      const imgElement = new Image(200, 200);
      imgElement.src = theme.logo;
      imgElement.alt = 'Logo';
      logoContainer.appendChild(imgElement);

      window.addEventListener('message', (event) => {
        if (event.data.type === 'NETWORK_CONTEXT') {
          sessionStorage.setItem('net_info', JSON.stringify(event.data.payload));
        }
        if (event.data.type === 'SET_SESSION') {
          sessionStorage.setItem('token_sandra', event.data.token);
          // window.location.reload();
        }

      });

    })();
  </script>

  <script>
    (function () {
      const APP_ID = 'sandra-consola';
      const MAX_BODY_LENGTH = 5000;

      // Referencias originales
      const original = {
        log: console.log,
        error: console.error,
        fetch: window.fetch,
        xhr: window.XMLHttpRequest
      };

      // Helper para comunicación con padre
      const sendToParent = (type, message, details = null) => {
        if (!window.parent) return;
        window.parent.postMessage({
          type: 'SDC_LOG',
          app_id: APP_ID,
          source: 'external-proxy',
          payload: {
            app_id: APP_ID,
            source: 'external-proxy',
            log_type: type,
            message,
            details
          }
        }, '*');
      };
      // Helper para truncar texto
      const truncate = (str) => {
        if (!str) return '[No Body]';
        return str.length > MAX_BODY_LENGTH ? str.substring(0, MAX_BODY_LENGTH) + '... (truncated)' : str;
      };

      // 1. Interceptar Console Error
      console.error = (...args) => {
        original.error.apply(console, args);
        const msg = args.map(a => (a instanceof Error ? `${a.message}\n${a.stack}` : a)).join(' ');
        sendToParent('ERROR', msg);
      };

      console.log = (...args) => {
        original.log.apply(console, args);
        const msg = args.map(a => {
          if (a instanceof Error) return `${a.message}\\n${a.stack}`;
          if (typeof a === 'object' && a !== null) return JSON.stringify(a, null, 2); // <- ¡Esta lógica serializa los objetos!
          return a;
        }).join(' ');

        sendToParent('LOG', msg);
      };

      // 2. Interceptar Fetch
      window.fetch = async (...args) => {
        const [resource, config] = args;
        const url = resource.toString();
        const method = config?.method || 'GET';

        try {
          const response = await original.fetch(...args);

          if (response.status >= 400) {
            let responseBody = '[No Body]';
            try {
              responseBody = await response.clone().text();
            } catch (e) { }

            sendToParent('FETCH', `HTTP Error ${response.status} ${method} ${url}`, {
              url: response.url || url,
              method,
              status: response.status,
              request_headers: config?.headers || {},
              request_payload: config?.body || null,
              response_body: truncate(responseBody),
              source: 'external-url'
            });
          }
          return response;
        } catch (err) {
          sendToParent('ERROR', `Fetch Exception: ${url} - ${err.message}`, { url, error: err.message });
          throw err;
        }
      };

      // 3. Interceptar XHR
      window.XMLHttpRequest = function () {
        const xhr = new original.xhr();
        let method = 'GET';
        let url = '';
        let requestBody = null;
        const requestHeaders = {};

        const originalOpen = xhr.open;
        xhr.open = (m, u, ...args) => {
          method = m;
          url = u;
          return originalOpen.apply(xhr, [m, u, ...args]);
        };

        const originalSetHeader = xhr.setRequestHeader;
        xhr.setRequestHeader = (header, value) => {
          requestHeaders[header] = value;
          return originalSetHeader.apply(xhr, [header, value]);
        };

        const originalSend = xhr.send;
        xhr.send = (body) => {
          requestBody = body;
          return originalSend.apply(xhr, [body]);
        };

        xhr.addEventListener('loadend', () => {
          if (xhr.status >= 400) {
            sendToParent('FETCH', `XHR Error ${xhr.status} ${method} ${url}`, {
              url: xhr.responseURL || url,
              method,
              status: xhr.status,
              request_headers: requestHeaders,
              request_payload: requestBody,
              response_body: truncate(xhr.responseText),
              source: 'external-url'
            });
          }
        });

        xhr.addEventListener('error', () => {
          sendToParent('ERROR', `XHR Network Exception: ${method} ${url}`, { url, method });
        });

        return xhr;
      };

      // Restaurar propiedades estáticas
      Object.assign(window.XMLHttpRequest, original.xhr);

      // sendToParent('INFO', `Monitor (XHR/Fetch) iniciado para ${APP_ID}`);


    })();
  </script>
