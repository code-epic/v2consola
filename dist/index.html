  <style type="text/css">
    #loading-bg {
      width: 100%;
      height: 100%;
      background: #fff;
      display: block;
      position: absolute;
      z-index: 99999;
      pointer-events: none;
    }

    .loading-logo {
      position: absolute;
      left: calc(50% - 125px);
      top: 35%;
    }

    .loading {
      position: absolute;
      left: calc(50% - 50px);
      top: 50%;
      width: 53px;
      height: 53px;
      border-radius: 50%;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      border: 3px solid transparent;
    }

    .loading .effect-1,
    .loading .effect-2 {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-left: 3px solid rgb(255, 149, 0);
      border-radius: 50%;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    .loading .effect-1 {
      animation: rotate 1s ease infinite;
    }

    .loading .effect-2 {
      animation: rotateOpacity 1s ease infinite 0.1s;
    }

    .loading .effect-3 {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-left: 3px solid rgb(255, 149, 0);
      -webkit-animation: rotateOpacity 1s ease infinite 0.2s;
      animation: rotateOpacity 1s ease infinite 0.2s;
      border-radius: 50%;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    .loading .effects {
      transition: all 0.3s ease;
    }

    @keyframes rotate {
      0% {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(1turn);
        transform: rotate(1turn);
      }
    }

    @keyframes rotateOpacity {
      0% {
        -webkit-transform: rotate(0deg);
        transform: rotate(0deg);
        opacity: 0.1;
      }

      100% {
        -webkit-transform: rotate(1turn);
        transform: rotate(1turn);
        opacity: 1;
      }
    }

    .btn-whatsapp {
      position: fixed;
      z-index: 999;
      bottom: 20px;
      right: 80px;
    }

    .btn-whatsapp:before,
    .btn-whatsapp:after {
      content: "";
      position: absolute;
      top: 10px;
      left: 10px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background-color: #eda409;
      opacity: 0;
      animation: onda 1s infinite;
    }

    .btn-whatsapp:before {
      animation-delay: 0.2s;
    }

    .btn-whatsapp:after {
      animation-delay: 0.5s;
    }

    .btn-whatsapp img {
      position: relative;
      z-index: 2;
    }

    @keyframes onda {
      0% {
        transform: scale(1);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: scale(2.5);
      }
    }
  </style>
<link rel="stylesheet" href="styles.c25a101bcc9aa079.css"></head>
